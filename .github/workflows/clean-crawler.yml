name: Check In

# Manually renew the 7-day trial without deleting workflow logs or stored data.
on:
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Renew trial and enable crawler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/check-in
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/check-in
          if ! git diff --cached --quiet; then
            git commit -m "chore: 手动签到续期 7 天 [skip ci]"
            git push origin HEAD:master
          fi
          gh workflow enable crawler.yml
          echo "已续期 7 天；运行记录和历史数据保持完整。" >> "$GITHUB_STEP_SUMMARY"
